<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Pet Care Management</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../Css/style.css">
    <style>
        .username-display {
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            border: 2px solid #c8e6c9;
            border-radius: 10px;
            padding: 12px 42px 12px 42px;
            font-size: 14px;
            color: #2e7d32;
            font-weight: 600;
            width: 100%;
            box-sizing: border-box;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2e7d32;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .back-link:hover {
            background: rgba(46, 125, 50, 0.08);
            color: #1b5e20;
            transform: translateX(-2px);
        }

        .strength-bar-wrapper {
            margin-top: 8px;
            display: none;
        }

        .strength-bar-bg {
            height: 4px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-label {
            font-size: 11px;
            margin-top: 4px;
            font-weight: 500;
        }

        .password-mismatch-msg {
            font-size: 12px;
            color: #d32f2f;
            margin-top: 4px;
            display: none;
        }

        .password-match-msg {
            font-size: 12px;
            color: #2e7d32;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="formAuth">
            <!-- Back link -->
            <a href="login.html" class="back-link" id="backLink">
                <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
            </a>

            <div class="auth-header">
                <div class="brand-badge">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2>Đổi mật khẩu</h2>
                <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <form id="forgotPasswordForm">
                <!-- Username (readonly, auto bind) -->
                <div class="mb-3 input-field-wrapper">
                    <label for="fp-username">Tài khoản</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon"></i>
                        <div class="username-display" id="fp-username-display">--</div>
                        <!-- Hidden input để submit cùng form -->
                        <input type="hidden" id="fp-username" name="username">
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-3 input-field-wrapper">
                    <label for="fp-new-password">Mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="fp-new-password"
                            class="form-control"
                            placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)..."
                            required
                            autocomplete="new-password"
                        >
                        <i class="fa-solid fa-eye toggle-password" id="toggleNewPassword" title="Hiện/ẩn mật khẩu"></i>
                    </div>
                    <!-- Password strength indicator -->
                    <div class="strength-bar-wrapper" id="strengthWrapper">
                        <div class="strength-bar-bg">
                            <div class="strength-bar-fill" id="strengthBarFill"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel"></div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3 input-field-wrapper">
                    <label for="fp-confirm-password">Xác nhận mật khẩu</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock-open input-icon"></i>
                        <input
                            type="password"
                            id="fp-confirm-password"
                            class="form-control"
                            placeholder="Nhập lại mật khẩu mới..."
                            required
                            autocomplete="new-password"
                        >
                        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPassword" title="Hiện/ẩn mật khẩu"></i>
                    </div>
                    <div class="password-mismatch-msg" id="mismatchMsg">
                        <i class="fa-solid fa-circle-xmark"></i> Mật khẩu không khớp
                    </div>
                    <div class="password-match-msg" id="matchMsg">
                        <i class="fa-solid fa-circle-check"></i> Mật khẩu khớp
                    </div>
                </div>

                <div class="btn-container">
                    <button class="btn btn-primary btn-auth" type="submit" id="btnChangePassword">
                        <i class="fa-solid fa-floppy-disk"></i> Đổi mật khẩu
                    </button>
                </div>

                <div class="auth-footer">
                    <span>Nhớ mật khẩu rồi? <a href="login.html" class="auth-link">Đăng nhập ngay</a></span>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../Controller/AuthController.js"></script>
    <script>
        // ===== Toggle hiện/ẩn mật khẩu =====
        function setupToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            if (toggle && input) {
                toggle.addEventListener('click', function () {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        }
        setupToggle('toggleNewPassword', 'fp-new-password');
        setupToggle('toggleConfirmPassword', 'fp-confirm-password');

        // ===== Password strength indicator =====
        const newPasswordInput = document.getElementById('fp-new-password');
        const strengthWrapper = document.getElementById('strengthWrapper');
        const strengthBarFill = document.getElementById('strengthBarFill');
        const strengthLabel = document.getElementById('strengthLabel');

        newPasswordInput.addEventListener('input', function () {
            const val = this.value;
            if (!val) {
                strengthWrapper.classList.remove('visible');
                return;
            }
            strengthWrapper.classList.add('visible');

            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const levels = [
                { label: 'Rất yếu', color: '#d32f2f', width: '20%' },
                { label: 'Yếu',     color: '#f57c00', width: '40%' },
                { label: 'Trung bình', color: '#fbc02d', width: '60%' },
                { label: 'Mạnh',    color: '#388e3c', width: '80%' },
                { label: 'Rất mạnh', color: '#1b5e20', width: '100%' },
            ];
            const level = levels[Math.min(score - 1, 4)] || levels[0];
            strengthBarFill.style.width = level.width;
            strengthBarFill.style.background = level.color;
            strengthLabel.textContent = level.label;
            strengthLabel.style.color = level.color;
        });

        // ===== Confirm password match =====
        const confirmInput = document.getElementById('fp-confirm-password');
        const mismatchMsg = document.getElementById('mismatchMsg');
        const matchMsg = document.getElementById('matchMsg');

        confirmInput.addEventListener('input', checkMatch);
        newPasswordInput.addEventListener('input', checkMatch);

        function checkMatch() {
            const newVal = newPasswordInput.value;
            const confirmVal = confirmInput.value;
            if (!confirmVal) {
                mismatchMsg.style.display = 'none';
                matchMsg.style.display = 'none';
                return;
            }
            if (newVal === confirmVal) {
                mismatchMsg.style.display = 'none';
                matchMsg.style.display = 'block';
            } else {
                matchMsg.style.display = 'none';
                mismatchMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
