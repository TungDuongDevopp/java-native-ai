<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Pet Care Management</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../Css/style.css">

</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="formAuth">
            <!-- Back link -->
            <a href="login.html" class="back-link" id="backLink">
                <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
            </a>

            <div class="auth-header">
                <div class="brand-badge">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2>Đổi mật khẩu</h2>
                <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <form id="changePasswordForm">
                <input type="hidden" id="fp-username" name="username">

                <!-- New Password -->
                <div class="mb-3 input-field-wrapper">
                    <label for="fp-new-password">Mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="fp-new-password"
                            class="form-control"
                            placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)..."
                            required
                            autocomplete="new-password"
                        >
                        <i class="fa-solid fa-eye toggle-password" id="toggleNewPassword" title="Hiện/ẩn mật khẩu"></i>
                    </div>

                </div>

                <!-- Confirm Password -->
                <div class="mb-3 input-field-wrapper">
                    <label for="fp-confirm-password">Xác nhận mật khẩu</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock-open input-icon"></i>
                        <input
                            type="password"
                            id="fp-confirm-password"
                            class="form-control"
                            placeholder="Nhập lại mật khẩu mới..."
                            required
                            autocomplete="new-password"
                        >
                        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPassword" title="Hiện/ẩn mật khẩu"></i>
                    </div>
                    <div class="password-mismatch-msg" id="mismatchMsg">
                        <i class="fa-solid fa-circle-xmark"></i> Mật khẩu không khớp
                    </div>
                    <div class="password-match-msg" id="matchMsg">
                        <i class="fa-solid fa-circle-check"></i> Mật khẩu khớp
                    </div>
                </div>

                <div class="btn-container">
                    <button class="btn btn-primary btn-auth" type="submit" id="btnChangePassword">
                        <i class="fa-solid fa-floppy-disk"></i> Đổi mật khẩu
                    </button>
                </div>

                <div class="auth-footer">
                    <span>Nhớ mật khẩu rồi? <a href="login.html" class="auth-link">Đăng nhập ngay</a></span>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../Controller/AuthController.js"></script>

    <script>
        // ===== Toggle hiện/ẩn mật khẩu =====
        function setupToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            if (toggle && input) {
                toggle.addEventListener('click', function () {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        }
        setupToggle('toggleNewPassword', 'fp-new-password');
        setupToggle('toggleConfirmPassword', 'fp-confirm-password');


        // ===== Confirm password match =====
        const newPasswordInput = document.getElementById('fp-new-password');
        const confirmInput = document.getElementById('fp-confirm-password');
        const mismatchMsg = document.getElementById('mismatchMsg');
        const matchMsg = document.getElementById('matchMsg');

        confirmInput.addEventListener('input', checkMatch);
        newPasswordInput.addEventListener('input', checkMatch);

        function checkMatch() {
            const newVal = newPasswordInput.value;
            const confirmVal = confirmInput.value;
            if (!confirmVal) {
                mismatchMsg.style.display = 'none';
                matchMsg.style.display = 'none';
                return;
            }
            if (newVal === confirmVal) {
                mismatchMsg.style.display = 'none';
                matchMsg.style.display = 'block';
            } else {
                matchMsg.style.display = 'none';
                mismatchMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
