<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Danh sách sản phẩm</h1>
    <button id="btnAdd">+ Thêm sản phẩm</button>

    <div>
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Mô tả</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody id="productTable">
            </tbody>
        </table>
    </div>

    <div id="formContainer" class="card p-3 mb-3" style="display:none;">

        <h4 id="formTitle">Thêm sản phẩm</h4>

        <form id="productForm">

            <div class="mb-3">
                <label>Tên sản phẩm</label>
                <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Nhập tên sản phẩm">
            </div>

            <div class="mb-3">
                <label>Giá</label>
                <input
                        type="number"
                        id="price"
                        class="form-control"
                        placeholder="Nhập giá"
                        min="0">
            </div>

            <div class="mb-3">
                <label>Số lượng</label>
                <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        placeholder="Nhập số lượng"
                        min="0">
            </div>
            <div class="mb-3">
                <label>Mô tả</label>
                <input
                       id="description"
                        class="form-control"
                        placeholder="Nhập mô tá"
                        >
            </div>

            <div class="btn">
                <button class="btn btn-primary" type="submit">
                    Lưu
                </button>

                <button
                        id="btnCancel"
                        type="button"
                        class="btn btn-secondary">
                    Hủy
                </button>
            </div>


        </form>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
